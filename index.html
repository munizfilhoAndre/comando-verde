/* Container que envolve os links */
.container {
  display: grid;
  /* Cria colunas que se ajustam sozinhas (mínimo 250px cada) */
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px; /* Espaço entre os cards */
  padding: 20px;
}

/* Remove sublinhado padrão dos links */
a {
  text-decoration: none;
  color: inherit;
}

figure {
  margin: 0;
  background: transparent;
  border-radius: 0px;
  overflow: hidden;
  transition: transform 0.3s ease;
  height: 100%; /* Garante que todos tenham a mesma altura */
  display: flex;
  flex-direction: column;
}

figure:hover {
  transform: scale(1.03);
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

figure img {
  width: auto;
  height: 190px;
  object-fit: cover;
  display: block;
}

figcaption {
  color: yellow;
  text-align: center;
  font-weight: bold;
}

/*destaque*/

.destaque {
display: grid;

}

  color: inherit;
}

.destaque figure {
